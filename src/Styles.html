<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --text: #1f2421;
    --muted: #5f6762;
    --line: #e3e0d8;
    --accent: #2f6b4f;
    --accent-text: #ffffff;
    --danger: #a3342b;
    --ok-bg: #e8f3ec;
    --warn-bg: #fbf1dd;
    --err-bg: #f8e4e1;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
  h2 { font-size: 1.1rem; }
  p { margin: 0 0 .75rem; }
  .muted { color: var(--muted); font-size: .9rem; }

  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius);
    padding: .45rem .9rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .55; cursor: default; }
  button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.perigo { color: var(--danger); }
  button.pequeno { padding: .2rem .6rem; font-size: .85rem; }

  input[type=text], textarea {
    font: inherit;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .45rem .6rem;
    background: var(--surface);
    color: var(--text);
  }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .aviso { border-radius: var(--radius); padding: .6rem .8rem; margin: .5rem 0; font-size: .92rem; }
  .aviso.ok { background: var(--ok-bg); }
  .aviso.alerta { background: var(--warn-bg); }
  .aviso.erro { background: var(--err-bg); color: var(--danger); }
  .aviso ul { margin: .3rem 0 0; padding-left: 1.2rem; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .etiqueta { display: inline-block; font-size: .75rem; padding: .05rem .5rem; border-radius: 999px; background: var(--ok-bg); }
  .etiqueta.inativo { background: var(--line); color: var(--muted); }
  tr.inativo td:first-child { color: var(--muted); }
</style>
