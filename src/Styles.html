<!-- Estilos do diálogo de administração. Mesma identidade das telas de pedido e cozinha (Tema.html). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #F5F7F7;
    --surface: #FFFFFF;
    --text: #18292F;
    --muted: #566A71;
    --line: #DCE4E6;
    --line-strong: #B9C8CC;
    --accent: #1E5A6E;          /* petróleo */
    --accent-dark: #154452;
    --accent-soft: #E4EEF1;
    --accent-text: #FFFFFF;
    --danger: #A8322D;
    --ok-bg: #E4EEF1;
    --warn: #7E520A;
    --warn-bg: #FBF1DC;
    --err-bg: #FBECEA;
    --radius: 10px;
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
  h2 { font-size: 1.1rem; }
  p { margin: 0 0 .75rem; }
  .muted { color: var(--muted); font-size: .9rem; }

  button {
    font: inherit;
    font-weight: 600;
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius);
    padding: .45rem .9rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primario:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.perigo { color: var(--danger); }
  button.pequeno { padding: .2rem .6rem; font-size: .85rem; }
  button.discreto { border-color: transparent; background: transparent; color: var(--accent); padding-inline: .5rem; }
  button.discreto:hover { background: var(--accent-soft); }

  input[type=text], textarea {
    font: inherit;
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: .45rem .6rem;
    background: var(--surface);
    color: var(--text);
  }
  input[type=checkbox] { accent-color: var(--accent); }
  :focus-visible, input:focus, textarea:focus { outline: 3px solid var(--accent); outline-offset: 1px; }

  .aviso { border-radius: var(--radius); padding: .6rem .8rem; margin: .5rem 0; font-size: .92rem; }
  .aviso.ok { background: var(--ok-bg); color: var(--accent-dark); }
  .aviso.alerta { background: var(--warn-bg); color: var(--warn); }
  .aviso.erro { background: var(--err-bg); color: var(--danger); }
  .aviso ul { margin: .3rem 0 0; padding-left: 1.2rem; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .etiqueta { display: inline-block; font-size: .78rem; font-weight: 600; padding: .1rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); }
  .etiqueta.inativo { background: var(--line); color: var(--muted); }
  tr.inativo td:first-child { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
